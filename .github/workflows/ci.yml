name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit frontend dependencies
        run: |
          npm --prefix frontend audit --package-lock-only
          npm --prefix frontend audit --omit=dev --package-lock-only

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Test first-run browser state
        working-directory: frontend
        env:
          PLAYWRIGHT_API_PORT: "8877"
          PLAYWRIGHT_WEB_PORT: "5274"
        run: npx playwright test --project=chromium-setup
